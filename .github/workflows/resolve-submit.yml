name: Resolve Issues & Submit Review

on:
  workflow_dispatch:

concurrency:
  group: asc-submit

jobs:
  fix:
    name: Copy screenshots to zh-Hans & submit 1.4.0(32)
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
    steps:
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography

      - name: Fix zh-Hans screenshots + submit
        run: |
          python3 - <<'EOF'
          import base64, hashlib, json, os, sys, time, urllib.request, urllib.error

          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          with open(p8, "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)

          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"

          def api(method, path, body=None, raw=False):
              url = "https://api.appstoreconnect.apple.com/v1" + path
              data = json.dumps(body).encode() if body else None
              for attempt in range(4):
                  req = urllib.request.Request(url, data=data, method=method,
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          payload_bytes = resp.read()
                          return json.loads(payload_bytes) if not raw else payload_bytes
                  except urllib.error.HTTPError as e:
                      err = e.read().decode()
                      print(f"  API {method} {path} -> {e.code}: {err[:500]}")
                      if e.code in (404, 409, 400):
                          raise
                      time.sleep(8)
              raise RuntimeError(f"API failed: {path}")

          def dl(url):
              req = urllib.request.Request(url)
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return resp.read()

          VER_ID = "cc9212ed-75d3-4abb-8ed7-f60c17bc28cf"  # 1.4.0
          APP_ID = "6792008756"

          locs = api("GET", f"/appStoreVersions/{VER_ID}/appStoreVersionLocalizations")["data"]
          loc = {l["attributes"]["locale"]: l["id"] for l in locs}
          print("locales:", list(loc))
          en_id, zh_id = loc["en-US"], loc["zh-Hans"]

          # ---- 1) en-US 已有截图（全集复制）----
          en_sets = api("GET", f"/appStoreVersionLocalizations/{en_id}/appScreenshotSets")["data"]
          zh_sets = api("GET", f"/appStoreVersionLocalizations/{zh_id}/appScreenshotSets")["data"]
          zh_by_type = {s["attributes"].get("screenshotDisplayType"): s["id"] for s in zh_sets}

          for es in en_sets:
              dtype = es["attributes"].get("screenshotDisplayType")
              shots = api("GET", f"/appScreenshotSets/{es['id']}/appScreenshots")["data"]
              print(f"en set {dtype or es['attributes']}: {len(shots)} shots")
              if not shots:
                  continue

              # zh-Hans 对应 displayType 的 set，没有则创建
              zs_id = zh_by_type.get(dtype)
              if not zs_id:
                  created = api("POST", "/appScreenshotSets", {"data": {
                      "type": "appScreenshotSets",
                      "attributes": {"screenshotDisplayType": dtype},
                      "relationships": {"appStoreVersionLocalization": {
                          "data": {"type": "appStoreVersionLocalizations", "id": zh_id}}},
                  }})
                  zs_id = created["data"]["id"]
                  print(f"  created zh set {dtype}: {zs_id}")

              # 逐张下载 -> 上传 -> commit（下载 URL 在内联 imageAsset 对象里）
              def find_urls(obj, path=""):
                  out = []
                  if isinstance(obj, dict):
                      for k, v in obj.items():
                          out += find_urls(v, f"{path}.{k}")
                  elif isinstance(obj, str) and obj.startswith("http"):
                      out.append((path, obj))
                  return out

              first = shots[0]
              print("  sample shot attrs:", json.dumps({k: v for k, v in first["attributes"].items()
                    if k not in ("uploadOperations",)}, default=str)[:800])

              for shot in shots:
                  sa = shot["attributes"]
                  ia = sa.get("imageAsset") or {}
                  tpl = ia.get("templateUrl")
                  url = (tpl.replace("{w}", str(ia.get("width", 0)))
                            .replace("{h}", str(ia.get("height", 0)))
                            .replace("{f}", "png")) if tpl else None
                  fname = sa.get("fileName") or "shot.png"
                  if not url:
                      print(f"  !! no download url for {shot['id']}, keys={list(sa)}")
                      continue
                  blob = dl(url)
                  print(f"  copied {fname} ({len(blob)} bytes)")
                  new_shot = api("POST", "/appScreenshots", {"data": {
                      "type": "appScreenshots",
                      "attributes": {"fileName": fname, "fileSize": len(blob)},
                      "relationships": {"appScreenshotSet": {
                          "data": {"type": "appScreenshotSets", "id": zs_id}}},
                  }})
                  sid = new_shot["data"]["id"]
                  for op in new_shot["data"]["attributes"]["uploadOperations"]:
                      req = urllib.request.Request(op["url"], data=blob[op["offset"]:op["offset"]+op["length"]],
                          method=op.get("method", "PUT"))
                      with urllib.request.urlopen(req, timeout=120):
                          pass
                  api("PATCH", f"/appScreenshots/{sid}", {"data": {
                      "type": "appScreenshots", "id": sid,
                      "attributes": {
                          "uploaded": True,
                          "sourceFileSha256": hashlib.sha256(blob).hexdigest(),
                      },
                  }})
                  print(f"  committed {fname} -> zh-Hans")
              time.sleep(2)

          # ---- 2) 确认 zh-Hans 截图就位 ----
          zh_sets2 = api("GET", f"/appStoreVersionLocalizations/{zh_id}/appScreenshotSets")["data"]
          for s in zh_sets2:
              n = len(api("GET", f"/appScreenshotSets/{s['id']}/appScreenshots")["data"])
              print(f"zh set {s['attributes'].get('screenshotDisplayType')}: {n} shots")

          # ---- 3) 提交审核 ----
          time.sleep(5)
          subs = api("GET", f"/reviewSubmissions?filter[app]={APP_ID}&filter[platform]=IOS")["data"]
          target = next((s for s in subs if s["attributes"].get("state") in
                        ("UNRESOLVED_ISSUES", "READY_FOR_REVIEW", "WAITING_FOR_REVIEW", "IN_REVIEW")), None)
          if not target:
              print("no active submission"); sys.exit(1)
          sub_id = target["id"]
          try:
              final = api("PATCH", f"/reviewSubmissions/{sub_id}", {"data": {
                  "type": "reviewSubmissions", "id": sub_id,
                  "attributes": {"submitted": True},
              }})
              print("SUBMITTED — state:", final["data"]["attributes"].get("state"))
          except Exception:
              print("!! submit still failing after screenshot fix")
              sys.exit(2)
          EOF
