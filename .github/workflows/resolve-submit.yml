name: Resolve Issues & Submit Review

on:
  workflow_dispatch:

concurrency:
  group: asc-submit

jobs:
  fix:
    name: Resolve open issues & submit 1.4.0(32)
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
    steps:
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography

      - name: Resolve issues + submit
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, time, urllib.request, urllib.error

          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          with open(p8, "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)

          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"

          def api(method, path, body=None):
              url = "https://api.appstoreconnect.apple.com/v1" + path
              data = json.dumps(body).encode() if body else None
              for attempt in range(4):
                  req = urllib.request.Request(url, data=data, method=method,
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as e:
                      err = e.read().decode()[:600]
                      print(f"  API {method} {path} -> {e.code}: {err}")
                      if e.code in (404, 409, 400):
                          raise
                      time.sleep(8)
              raise RuntimeError(f"API failed: {path}")

          APP_ID = "6792008756"

          # 1) 活跃 submission
          subs = api("GET", f"/reviewSubmissions?filter[app]={APP_ID}&filter[platform]=IOS")["data"]
          target = next((s for s in subs if s["attributes"].get("state") in
                        ("UNRESOLVED_ISSUES", "READY_FOR_REVIEW", "WAITING_FOR_REVIEW", "IN_REVIEW")), None)
          if not target:
              print("no active submission found")
              sys.exit(1)
          sub_id = target["id"]
          print("submission:", sub_id, "state:", target["attributes"].get("state"))

          # 2) 版本 item
          items = api("GET", f"/reviewSubmissions/{sub_id}/items")["data"]
          ver_item = items[0] if items else None
          if not ver_item:
              print("no items in submission")
              sys.exit(1)
          item_id = ver_item["id"]
          print("version item:", item_id, "state:", ver_item["attributes"].get("state"))

          # 3) 列出该 item 的审核问题（专用子资源端点）
          try:
              issues = api("GET", f"/reviewSubmissionItems/{item_id}/reviewSubmissionIssues")["data"]
          except Exception as e:
              print("issues query failed:", repr(e))
              issues = []
          print("open issues found:", len(issues))
          for i in issues:
              ia = i["attributes"]
              print(f"  issue {i['id']}: state={ia.get('state')} resolved={ia.get('resolved')}")
              print(f"    title: {ia.get('title')}")
              print(f"    body: {(ia.get('body') or '')[:300]}")

          # 4) 逐个标记 resolved（开发者已在 Resolution Center 回复过，等价于网页的 Reply and resolve）
          for i in issues:
              if i["attributes"].get("resolved"):
                  print("  already resolved, skip")
                  continue
              try:
                  api("PATCH", f"/reviewSubmissionIssues/{i['id']}", {"data": {
                      "type": "reviewSubmissionIssues", "id": i["id"],
                      "attributes": {"resolved": True},
                  }})
                  print("  resolved:", i["id"])
              except Exception as e:
                  print("  resolve failed:", i["id"], repr(e))

          # 5) 确认 submission 状态翻转后重新提交
          time.sleep(10)
          cur = api("GET", f"/reviewSubmissions/{sub_id}")["data"]["attributes"]
          print("state after resolve:", cur.get("state"))
          final = api("PATCH", f"/reviewSubmissions/{sub_id}", {"data": {
              "type": "reviewSubmissions", "id": sub_id,
              "attributes": {"submitted": True},
          }})
          print("SUBMITTED — state:", final["data"]["attributes"].get("state"))
          EOF
