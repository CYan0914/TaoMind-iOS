name: Resolve Issues & Submit Review

on:
  workflow_dispatch:

concurrency:
  group: asc-submit

jobs:
  fix:
    name: Rebuild rejected item & submit 1.4.0(32)
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
    steps:
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography

      - name: Rebuild item + submit
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, time, urllib.request, urllib.error

          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          with open(p8, "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)

          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"

          def api(method, path, body=None, full_err=False):
              url = "https://api.appstoreconnect.apple.com/v1" + path
              data = json.dumps(body).encode() if body else None
              for attempt in range(4):
                  req = urllib.request.Request(url, data=data, method=method,
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as e:
                      err = e.read().decode()
                      print(f"  API {method} {path} -> {e.code}: {err if full_err else err[:300]}")
                      if e.code in (404, 409, 400):
                          raise
                      time.sleep(8)
              raise RuntimeError(f"API failed: {path}")

          APP_ID = "6792008756"
          VER_ID = "cc9212ed-75d3-4abb-8ed7-f60c17bc28cf"  # 1.4.0

          # ---- 诊断 1: 1.4.0 版本截图完整性 ----
          print("---- screenshots ----")
          locs = api("GET", f"/appStoreVersions/{VER_ID}/appStoreVersionLocalizations")["data"]
          for l in locs:
              lid, locale = l["id"], l["attributes"].get("locale")
              try:
                  sets = api("GET", f"/appStoreVersionLocalizations/{lid}/appScreenshotSets")["data"]
                  counts = {}
                  for st in sets:
                      n = len(api("GET", f"/appScreenshotSets/{st['id']}/appScreenshots")["data"])
                      counts[st["attributes"].get("displayType")] = n
                  print(f"  {locale}: {counts}")
              except Exception as e:
                  print(f"  {locale}: failed {e!r}")

          # ---- 诊断 2: 版本状态 ----
          ver = api("GET", f"/appStoreVersions/{VER_ID}")["data"]
          print("version state:", ver["attributes"].get("appStoreState"))

          # ---- 修复: 移除 REJECTED 旧 item -> 创建新 item ----
          subs = api("GET", f"/reviewSubmissions?filter[app]={APP_ID}&filter[platform]=IOS")["data"]
          target = next((s for s in subs if s["attributes"].get("state") in
                        ("UNRESOLVED_ISSUES", "READY_FOR_REVIEW", "WAITING_FOR_REVIEW", "IN_REVIEW")), None)
          if not target:
              print("no active submission found"); sys.exit(1)
          sub_id = target["id"]
          print("submission:", sub_id, "state:", target["attributes"].get("state"))

          items = api("GET", f"/reviewSubmissions/{sub_id}/items")["data"]
          for it in items:
              st = it["attributes"].get("state")
              print("item:", it["id"], "state:", st)
              if st in ("REJECTED", "REMOVED", "CANCELLED"):
                  api("PATCH", f"/reviewSubmissionItems/{it['id']}", {"data": {
                      "type": "reviewSubmissionItems", "id": it["id"],
                      "attributes": {"removed": True},
                  }}, full_err=True)
                  print("  removed")
              time.sleep(3)

          # 移除后重新拉取，若已无版本 item 则创建指向 1.4.0 的新 item
          items = api("GET", f"/reviewSubmissions/{sub_id}/items")["data"]
          print("items after removal:", [(i["id"], i["attributes"].get("state")) for i in items])
          live = [i for i in items if not i["attributes"].get("removed")]
          if not live:
              created = api("POST", "/reviewSubmissionItems", {"data": {
                  "type": "reviewSubmissionItems",
                  "attributes": {},
                  "relationships": {
                      "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                      "appStoreVersion": {"data": {"type": "appStoreVersions", "id": VER_ID}},
                  },
              }}, full_err=True)
              print("new item created:", created["data"]["id"], "state:", created["data"]["attributes"].get("state"))
          else:
              print("live item exists:", live[0]["id"], "state:", live[0]["attributes"].get("state"))

          # ---- 提交 ----
          time.sleep(5)
          try:
              final = api("PATCH", f"/reviewSubmissions/{sub_id}", {"data": {
                  "type": "reviewSubmissions", "id": sub_id,
                  "attributes": {"submitted": True},
              }}, full_err=True)
              print("SUBMITTED — state:", final["data"]["attributes"].get("state"))
          except Exception as e:
              print("!! submit still failing — see full 409 body above (meta.associatedErrors)")
              sys.exit(2)
          EOF
