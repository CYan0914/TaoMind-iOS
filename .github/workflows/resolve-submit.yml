name: Resolve Issues & Submit Review

on:
  workflow_dispatch:

concurrency:
  group: asc-submit

jobs:
  fix:
    name: Dedupe zh-Hans screenshots & submit 1.4.0(32)
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
    steps:
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography

      - name: Dedupe + submit
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, time, urllib.request, urllib.error

          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          with open(p8, "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)

          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"

          def api(method, path, body=None):
              url = "https://api.appstoreconnect.apple.com/v1" + path
              data = json.dumps(body).encode() if body else None
              for attempt in range(4):
                  req = urllib.request.Request(url, data=data, method=method,
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as e:
                      err = e.read().decode()
                      print(f"  API {method} {path} -> {e.code}: {err[:400]}")
                      if e.code in (404, 409, 400):
                          raise
                      time.sleep(8)
              raise RuntimeError(f"API failed: {path}")

          VER_ID = "cc9212ed-75d3-4abb-8ed7-f60c17bc28cf"  # 1.4.0
          APP_ID = "6792008756"

          locs = api("GET", f"/appStoreVersions/{VER_ID}/appStoreVersionLocalizations")["data"]
          loc = {l["attributes"]["locale"]: l["id"] for l in locs}
          zh_id = loc["zh-Hans"]

          # ---- 1) zh-Hans 截图按 fileName 去重（保留首张，删多余）----
          zh_sets = api("GET", f"/appStoreVersionLocalizations/{zh_id}/appScreenshotSets")["data"]
          for s in zh_sets:
              dtype = s["attributes"].get("screenshotDisplayType")
              shots = api("GET", f"/appScreenshotSets/{s['id']}/appScreenshots")["data"]
              print(f"zh set {dtype}: {len(shots)} shots")
              seen = set()
              for shot in shots:
                  fn = shot["attributes"].get("fileName")
                  if fn in seen:
                      api("DELETE", f"/appScreenshots/{shot['id']}")
                      print(f"  deleted dup {fn}")
                  else:
                      seen.add(fn)
              print(f"  kept {len(seen)} unique")

          # 复核
          zh_sets = api("GET", f"/appStoreVersionLocalizations/{zh_id}/appScreenshotSets")["data"]
          for s in zh_sets:
              n = len(api("GET", f"/appScreenshotSets/{s['id']}/appScreenshots")["data"])
              print(f"final zh {s['attributes'].get('screenshotDisplayType')}: {n}")

          # ---- 2) submission：有活跃的复用，没有新建 ----
          subs = api("GET", f"/reviewSubmissions?filter[app]={APP_ID}&filter[platform]=IOS")["data"]
          for s in subs:
              print("submission:", s["id"], "state:", s["attributes"].get("state"))
          target = next((s for s in subs if s["attributes"].get("state") in
                        ("UNRESOLVED_ISSUES", "READY_FOR_REVIEW", "WAITING_FOR_REVIEW", "IN_REVIEW")), None)
          if target:
              sub_id = target["id"]
              print("reusing:", sub_id)
          else:
              created = api("POST", "/reviewSubmissions", {"data": {
                  "type": "reviewSubmissions",
                  "attributes": {"platform": "IOS"},
                  "relationships": {"app": {"data": {"type": "apps", "id": APP_ID}}},
              }})
              sub_id = created["data"]["id"]
              print("created submission:", sub_id, "state:", created["data"]["attributes"].get("state"))

          # ---- 3) item：清无效，保一个指向 1.4.0 ----
          items = api("GET", f"/reviewSubmissions/{sub_id}/items")["data"]
          for it in items:
              st = it["attributes"].get("state")
              print("item:", it["id"], "state:", st)
              if st in ("REJECTED", "REMOVED", "CANCELLED"):
                  try:
                      api("PATCH", f"/reviewSubmissionItems/{it['id']}", {"data": {
                          "type": "reviewSubmissionItems", "id": it["id"],
                          "attributes": {"removed": True},
                      }})
                      print("  removed")
                  except Exception as e:
                      print("  remove failed:", repr(e))
                  time.sleep(3)
          items = api("GET", f"/reviewSubmissions/{sub_id}/items")["data"]
          live = [i for i in items if i["attributes"].get("state") not in ("REMOVED", "REJECTED", "CANCELLED")]
          if not live:
              created = api("POST", "/reviewSubmissionItems", {"data": {
                  "type": "reviewSubmissionItems",
                  "attributes": {},
                  "relationships": {
                      "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                      "appStoreVersion": {"data": {"type": "appStoreVersions", "id": VER_ID}},
                  },
              }})
              print("new item created:", created["data"]["id"], "state:", created["data"]["attributes"].get("state"))

          # ---- 4) 提交 ----
          time.sleep(5)
          try:
              final = api("PATCH", f"/reviewSubmissions/{sub_id}", {"data": {
                  "type": "reviewSubmissions", "id": sub_id,
                  "attributes": {"submitted": True},
              }})
              print("SUBMITTED — state:", final["data"]["attributes"].get("state"))
          except Exception:
              print("!! submit still failing")
              sys.exit(2)
          EOF
