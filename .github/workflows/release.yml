name: Publish to App Store

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Fill What's New & Submit Review
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
    steps:
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography

      - name: Fill What's New + associate build + submit review
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, time, urllib.request, urllib.error

          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          with open(p8, "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)

          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}  # exp 必须 ≤20 分钟，+1800 会 401
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          # ES256 JWT 需要 raw R||S（64 字节），cryptography 默认返回 DER（~71 字节）→ 必须转换
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"

          def api(method, path, body=None):
              url = "https://api.appstoreconnect.apple.com/v1" + path
              data = json.dumps(body).encode() if body else None
              for attempt in range(4):
                  req = urllib.request.Request(url, data=data, method=method,
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as e:
                      err = e.read().decode()[:800]
                      print(f"  API {method} {path} -> {e.code}: {err}")
                      if e.code in (409, 404):
                          raise
                      time.sleep(10)  # 429 / 5xx retry
              raise RuntimeError(f"API failed after retries: {path}")

          BUNDLE = "com.cyan0914.taomind"
          VERSION = "1.3.1"
          BUILD = "28"

          # App Store 的 What's New 不接受 emoji（✨ 会 409 INVALID_CHARACTERS）
          WHATS_NEW_EN = (
              "**Voice Input**\n"
              "Speak your question instead of typing it. Tap the microphone in the "
              "\"Your Situation\" field and describe what you're facing out loud — "
              "TaoMind transcribes your words and brings you the wisdom you seek. "
              "Works in both English and Chinese."
          )
          WHATS_NEW_ZH = (
              "**语音输入**\n"
              "不再打字，直接说出你的问题。点击“你的处境”输入框里的麦克风，"
              "开口描述你的境况即可——TaoMind 会自动将你的话转为文字，"
              "并为你带来古人的智慧。支持中文和英文。"
          )

          # 1) Find app
          apps = api("GET", f"/apps?filter[bundleId]={BUNDLE}")["data"]
          if not apps:
              sys.exit("app not found by bundle id")
          app_id = apps[0]["id"]
          print("app:", app_id)

          # 2) Wait for build 24 to finish Apple processing
          # Build 资源的 attributes.version 是构建号（buildNumber），filter[buildNumber] 不是合法过滤器
          # 需用 filter[preReleaseVersion.version]（App 版本）过滤后再在代码里匹配构建号
          build_id = None
          for i in range(80):
              builds = api("GET", f"/builds?filter[app]={app_id}&filter[preReleaseVersion.version]={VERSION}")["data"]
              for b in builds:
                  if b["attributes"].get("version") == BUILD:
                      st = b["attributes"].get("processingState", "UNKNOWN")
                      print(f"  build poll {i}: {st}")
                      if st == "VALID":
                          build_id = b["id"]
                      break
              if build_id:
                  break
              time.sleep(15)
          if not build_id:
              sys.exit("build 1.3.1(28) not VALID within timeout")

          # 3) Find or create App Store version 1.3.0
          vers = api("GET", f"/apps/{app_id}/appStoreVersions?filter[platform]=IOS&filter[versionString]={VERSION}")["data"]
          if vers:
              ver_id = vers[0]["id"]
              print("version:", ver_id)
          else:
              created = api("POST", "/appStoreVersions", {"data": {
                  "type": "appStoreVersions",
                  "attributes": {"platform": "IOS", "versionString": VERSION},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
              }})
              ver_id = created["data"]["id"]
              print("created version:", ver_id)

          # 4) Associate build with the version
          api("PATCH", f"/appStoreVersions/{ver_id}", {"data": {
              "type": "appStoreVersions", "id": ver_id,
              "relationships": {"build": {"data": {"type": "builds", "id": build_id}}},
          }})
          print("build associated:", build_id)

          # 5) Fill What's New for en-US and zh-Hans
          # 新建版本时 ASC 自动为 en-US 创建本地化（含 description 等元数据），但 zh-Hans 不会自动创建
          # → 新建时必须补全提交审核所需的必填字段；已存在的只补缺失字段（不覆盖已有 description）
          LOCALE_META = {
              "en-US": {
                  "description": (
                      "TaoMind - Wisdom for the Modern Journey\n\n"
                      "Discover timeless wisdom from the Tao Te Ching and Diamond Sutra, "
                      "reimagined through AI to guide your daily life.\n\n"
                      "WHY TAOMIND?\n"
                      "Life presents complex challenges - career crossroads, leadership dilemmas, "
                      "personal struggles, difficult relationships. Ancient philosophers faced the same "
                      "human questions. TaoMind bridges their wisdom to your modern context.\n\n"
                      "CORE FEATURES\n"
                      "* Seek Wisdom: describe your situation and receive a relevant verse, a clear "
                      "interpretation, a reflection prompt, and practical guidance.\n"
                      "* Daily Verse: start each day with a curated verse paired with a reflection question.\n"
                      "* Journal: every session is saved automatically so you can revisit past insights.\n"
                      "* Bilingual: full support for English and Chinese (Simplified)."
                  ),
                  "keywords": "wisdom,taoism,reflection,buddhism,meditation,mindfulness,zen,dao,AI,philosophy,sutra,tao te ching",
                  "supportUrl": "https://cyan0914.github.io/taomind-privacy/support.html",
              },
              "zh-Hans": {
                  "description": (
                      "TaoMind · 现代旅途的智慧\n\n"
                      "从《道德经》与《金刚经》中汲取永恒的智慧，经由 AI 重新诠释，指引你的日常生活。\n\n"
                      "核心功能\n"
                      "* 寻求智慧：描述你的处境，获得应景经文、白话诠释、反思与可行指引。\n"
                      "* 每日一签：每天一句经文配一道反思题，伴你度过一天。\n"
                      "* 修习日志：每次修习自动保存，回看洞见、追踪成长。\n"
                      "* 双语支持：完整支持英文与简体中文。\n"
                      "* 语音输入：说出你的问题，自动转成文字。"
                  ),
                  "keywords": "智慧,道家,反思,佛教,冥想,正念,禅,道,AI,哲学,佛经,道德经,金刚经,语音",
                  "supportUrl": "https://cyan0914.github.io/taomind-privacy/support.html",
              },
          }

          locs = api("GET", f"/appStoreVersions/{ver_id}/appStoreVersionLocalizations")["data"]
          print("existing localizations:", [(l["id"], l["attributes"].get("locale")) for l in locs])
          have = {l["attributes"].get("locale"): l["id"] for l in locs}

          def set_whats_new(locale, text):
              meta = LOCALE_META[locale]
              if locale in have:
                  lid = have[locale]
                  cur = api("GET", f"/appStoreVersionLocalizations/{lid}")["data"]["attributes"]
                  attrs = {"whatsNew": text}
                  for f in ("description", "keywords", "supportUrl"):
                      if not cur.get(f):
                          attrs[f] = meta[f]
                  api("PATCH", f"/appStoreVersionLocalizations/{lid}", {"data": {
                      "type": "appStoreVersionLocalizations", "id": lid,
                      "attributes": attrs,
                  }})
                  print("whatsNew set:", locale, "(missing fields filled:", [f for f in ("description", "keywords", "supportUrl") if not cur.get(f)], ")")
              else:
                  created = api("POST", "/appStoreVersionLocalizations", {"data": {
                      "type": "appStoreVersionLocalizations",
                      "attributes": {
                          "locale": locale,
                          "whatsNew": text,
                          "description": meta["description"],
                          "keywords": meta["keywords"],
                          "supportUrl": meta["supportUrl"],
                      },
                      "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": ver_id}}},
                  }})
                  print("localization created:", locale)

          set_whats_new("en-US", WHATS_NEW_EN)
          set_whats_new("zh-Hans", WHATS_NEW_ZH)

          # 6) Submit for App Store review（modern reviewSubmissions flow, API v1.7+）
          # appStoreVersionSubmissions 已不允许 CREATE（403），需三步：
          #   创建 submission → 添加 appStoreVersion item → PATCH submitted=true
          sub = api("POST", "/reviewSubmissions", {"data": {
              "type": "reviewSubmissions",
              "attributes": {"platform": "IOS"},
              "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
          }})
          sub_id = sub["data"]["id"]
          print("review submission:", sub_id, "state:", sub["data"]["attributes"].get("state"))

          api("POST", "/reviewSubmissionItems", {"data": {
              "type": "reviewSubmissionItems",
              "relationships": {
                  "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                  "appStoreVersion": {"data": {"type": "appStoreVersions", "id": ver_id}},
              },
          }})
          print("submission item added")

          final = api("PATCH", f"/reviewSubmissions/{sub_id}", {"data": {
              "type": "reviewSubmissions", "id": sub_id,
              "attributes": {"submitted": True},
          }})
          print("SUBMITTED for review — state:", final["data"]["attributes"].get("state"))
          EOF

      - name: Summary
        run: |
          gh run view ${{ github.run_id }} --json status,conclusion,url
          echo "Published 1.3.0 (27) — What's New filled, submitted for App Store review."
