name: Publish to App Store

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Fill What's New & Submit Review
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
    steps:
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography

      - name: Fill What's New + associate build + submit review
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, time, urllib.request, urllib.error

          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          with open(p8, "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)

          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}  # exp 必须 ≤20 分钟，+1800 会 401
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          # ES256 JWT 需要 raw R||S（64 字节），cryptography 默认返回 DER（~71 字节）→ 必须转换
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"

          def api(method, path, body=None):
              url = "https://api.appstoreconnect.apple.com/v1" + path
              data = json.dumps(body).encode() if body else None
              for attempt in range(4):
                  req = urllib.request.Request(url, data=data, method=method,
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as e:
                      err = e.read().decode()[:800]
                      print(f"  API {method} {path} -> {e.code}: {err}")
                      if e.code in (409, 404):
                          raise
                      time.sleep(10)  # 429 / 5xx retry
              raise RuntimeError(f"API failed after retries: {path}")

          BUNDLE = "com.cyan0914.taomind"
          # 已批准/被拒版本 1.5.0 的 train 已关闭 — 不能复用同 version 字符串
          # （PATCH build 关联会 409 RELATIONSHIP.INVALID.INVALID_STATE）。
          # bump 到 1.5.1 (build 44) 是 ASC 关 train 后的标准恢复路径。
          VERSION = "1.5.1"
          BUILD = "44"
          # 2.1(b) 被拒后新增的 Lifetime 买断：ASC 上还是 Ready to Submit，
          # 必须随本次版本一起提交审核，否则审核员在 app 里仍看不到该 IAP
          LIFETIME_PRODUCT_ID = "taomind_pro_lifetime"

          # App Store 的 What's New 不接受 emoji（✨ 会 409 INVALID_CHARACTERS）
          # build 40-44 用户能感知的增量：
          #   41: Google 登录（已有 Apple 登录之外，海外用户多一个选择）
          #   42: 年卡下面挂「N 天免费试用」金印+文字，天数从 RC 后台 intro discount 动态算
          #   40: 付费墙 100% 自动关闭的 bug（之前用户首启就立即关掉付费墙）
          #   44: Journal 空状态整屏宣纸底（之前只有中间一个方块，周围白）
          # 邀请码/评分/社交证明/视觉统一是 34 已有功能，不再列；本次只列 40-44 增量。
          WHATS_NEW_EN = (
              "**Sign in with Google**\n"
              "You can now sign in to TaoMind with your Google account, in addition "
              "to Apple. Your daily practice, journal, and streaks sync across devices "
              "the moment you sign in.\n\n"
              "**Free trial on the annual plan**\n"
              "The annual subscription now shows a 'try it free' line under the price, "
              "so you can experience the full library of the Tao Te Ching and Diamond "
              "Sutra before committing. The trial length is set by us and shown in the "
              "paywall — no surprise charges, cancel anytime in App Store settings.\n\n"
              "**Smoother paywall & journal**\n"
              "We fixed a bug that closed the paywall too quickly on first launch. "
              "The empty Journal screen now uses the same xuan-paper ground as the "
              "rest of the app for a calmer, more unified feel."
          )
          WHATS_NEW_ZH = (
              "**支持 Google 账号登录**\n"
              "除了 Apple 登录，你现在也可以用 Google 账号登录 TaoMind。\n"
              "登录后每日功课、修行日志、连续打卡数据会在多设备间即时同步。\n\n"
              "**年卡免费试用**\n"
              "年卡订阅现在会在价格下方标注「N 天免费试用」。\n"
              "你可以先完整体验《道德经》与《金刚经》全文精读，再决定是否继续。\n"
              "试用天数由我们设定并明示在付费墙中——不会偷偷扣款，随时可在 App Store 设置中取消。\n\n"
              "**付费墙与日志页更顺手**\n"
              "修复了首启时付费墙过快关闭的 bug。\n"
              "空白的修行日志页现在也统一为宣纸底色，与全站视觉保持一致，更沉稳、更统一。"
          )

          # 1) Find app
          apps = api("GET", f"/apps?filter[bundleId]={BUNDLE}")["data"]
          if not apps:
              sys.exit("app not found by bundle id")
          app_id = apps[0]["id"]
          print("app:", app_id)

          # 2) Wait for build 24 to finish Apple processing
          # Build 资源的 attributes.version 是构建号（buildNumber），filter[buildNumber] 不是合法过滤器
          # 需用 filter[preReleaseVersion.version]（App 版本）过滤后再在代码里匹配构建号
          build_id = None
          for i in range(80):
              builds = api("GET", f"/builds?filter[app]={app_id}&filter[preReleaseVersion.version]={VERSION}")["data"]
              for b in builds:
                  if b["attributes"].get("version") == BUILD:
                      st = b["attributes"].get("processingState", "UNKNOWN")
                      print(f"  build poll {i}: {st}")
                      if st == "VALID":
                          build_id = b["id"]
                      break
              if build_id:
                  break
              time.sleep(15)
          if not build_id:
              sys.exit("build 1.4.0(30) not VALID within timeout")

          # 3) Find or create App Store version 1.3.0
          vers = api("GET", f"/apps/{app_id}/appStoreVersions?filter[platform]=IOS&filter[versionString]={VERSION}")["data"]
          if vers:
              ver_id = vers[0]["id"]
              print("version:", ver_id)
          else:
              created = api("POST", "/appStoreVersions", {"data": {
                  "type": "appStoreVersions",
                  "attributes": {"platform": "IOS", "versionString": VERSION},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
              }})
              ver_id = created["data"]["id"]
              print("created version:", ver_id)

          # 4) Associate build with the version
          api("PATCH", f"/appStoreVersions/{ver_id}", {"data": {
              "type": "appStoreVersions", "id": ver_id,
              "relationships": {"build": {"data": {"type": "builds", "id": build_id}}},
          }})
          print("build associated:", build_id)

          # 5) Fill What's New for en-US and zh-Hans
          # 新建版本时 ASC 自动为 en-US 创建本地化（含 description 等元数据），但 zh-Hans 不会自动创建
          # → 新建时必须补全提交审核所需的必填字段；已存在的只补缺失字段（不覆盖已有 description）
          LOCALE_META = {
              "en-US": {
                  "description": (
                      "TaoMind - Wisdom for the Modern Journey\n\n"
                      "Discover timeless wisdom from the Tao Te Ching and Diamond Sutra, "
                      "reimagined through AI to guide your daily life.\n\n"
                      "WHY TAOMIND?\n"
                      "Life presents complex challenges - career crossroads, leadership dilemmas, "
                      "personal struggles, difficult relationships. Ancient philosophers faced the same "
                      "human questions. TaoMind bridges their wisdom to your modern context.\n\n"
                      "CORE FEATURES\n"
                      "* Seek Wisdom: describe your situation and receive a relevant verse, a clear "
                      "interpretation, a reflection prompt, and practical guidance.\n"
                      "* Daily Verse: start each day with a curated verse paired with a reflection question.\n"
                      "* Journal: every session is saved automatically so you can revisit past insights.\n"
                      "* Bilingual: full support for English and Chinese (Simplified)."
                  ),
                  "keywords": "wisdom,taoism,reflection,buddhism,meditation,mindfulness,zen,dao,AI,philosophy,sutra,tao te ching",
                  "supportUrl": "https://cyan0914.github.io/taomind-privacy/support.html",
              },
              "zh-Hans": {
                  "description": (
                      "TaoMind · 现代旅途的智慧\n\n"
                      "从《道德经》与《金刚经》中汲取永恒的智慧，经由 AI 重新诠释，指引你的日常生活。\n\n"
                      "核心功能\n"
                      "* 寻求智慧：描述你的处境，获得应景经文、白话诠释、反思与可行指引。\n"
                      "* 每日一签：每天一句经文配一道反思题，伴你度过一天。\n"
                      "* 修习日志：每次修习自动保存，回看洞见、追踪成长。\n"
                      "* 双语支持：完整支持英文与简体中文。\n"
                      "* 语音输入：说出你的问题，自动转成文字。"
                  ),
                  "keywords": "智慧,道家,反思,佛教,冥想,正念,禅,道,AI,哲学,佛经,道德经,金刚经,语音",
                  "supportUrl": "https://cyan0914.github.io/taomind-privacy/support.html",
              },
          }

          locs = api("GET", f"/appStoreVersions/{ver_id}/appStoreVersionLocalizations")["data"]
          print("existing localizations:", [(l["id"], l["attributes"].get("locale")) for l in locs])
          have = {l["attributes"].get("locale"): l["id"] for l in locs}

          def set_whats_new(locale, text):
              meta = LOCALE_META[locale]
              if locale in have:
                  lid = have[locale]
                  cur = api("GET", f"/appStoreVersionLocalizations/{lid}")["data"]["attributes"]
                  attrs = {"whatsNew": text}
                  for f in ("description", "keywords", "supportUrl"):
                      if not cur.get(f):
                          attrs[f] = meta[f]
                  api("PATCH", f"/appStoreVersionLocalizations/{lid}", {"data": {
                      "type": "appStoreVersionLocalizations", "id": lid,
                      "attributes": attrs,
                  }})
                  print("whatsNew set:", locale, "(missing fields filled:", [f for f in ("description", "keywords", "supportUrl") if not cur.get(f)], ")")
              else:
                  created = api("POST", "/appStoreVersionLocalizations", {"data": {
                      "type": "appStoreVersionLocalizations",
                      "attributes": {
                          "locale": locale,
                          "whatsNew": text,
                          "description": meta["description"],
                          "keywords": meta["keywords"],
                          "supportUrl": meta["supportUrl"],
                      },
                      "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": ver_id}}},
                  }})
                  print("localization created:", locale)

          set_whats_new("en-US", WHATS_NEW_EN)
          set_whats_new("zh-Hans", WHATS_NEW_ZH)

          # 6) Submit for App Store review（modern reviewSubmissions flow, API v1.7+）
          # appStoreVersionSubmissions 已不允许 CREATE（403），需三步：
          #   创建 submission → 添加 appStoreVersion item → PATCH submitted=true
          # 1.3.1(28) 被 REJECTED 后旧 submission 处于 UNRESOLVED_ISSUES / 版本项 REJECTED，
          # 不能再 POST 新 submission（409）——改为复用：找现有 submission，PATCH 版本项换新 build 后
          # 重新 PATCH submitted=true（等价于浏览器里的「更新审核」+「重新提交至 App 审核」）。
          subs = api("GET", f"/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS")["data"]
          sub_id = None
          for s in subs:
              if s["attributes"].get("state") in ("UNRESOLVED_ISSUES", "READY_FOR_REVIEW", "WAITING_FOR_REVIEW", "IN_REVIEW"):
                  sub_id = s["id"]
                  print("reusing review submission:", sub_id, "state:", s["attributes"].get("state"))
                  break
          if not sub_id:
              sub = api("POST", "/reviewSubmissions", {"data": {
                  "type": "reviewSubmissions",
                  "attributes": {"platform": "IOS"},
                  "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
              }})
              sub_id = sub["data"]["id"]
              print("created review submission:", sub_id, "state:", sub["data"]["attributes"].get("state"))

          # 找到本 submission 下的 appStoreVersion item。
          # 被拒后 submission 处于 UNRESOLVED_ISSUES —— 不允许 POST 新 item(409)，
          # 必须复用已有 item。list 端点不回填 relationship data，
          # 必须 ?include=appStoreVersion 才能拿到 item->version 的指向。
          items = api("GET", f"/reviewSubmissions/{sub_id}/items?include=appStoreVersion")["data"]
          print("submission items:", [(i["id"], list(i.get("relationships", {}).keys())) for i in items])
          ver_item = next((i for i in items if i.get("relationships", {})
                          .get("appStoreVersion", {}).get("data")), None)
          if ver_item is None and not items:
              # 全新 train 首提：新建的 submission 不含任何 item，必须显式创建版本 item
              # 创建端点是顶层 /reviewSubmissionItems（嵌套路径只支持 GET，POST 405）
              try:
                  created_item = api("POST", "/reviewSubmissionItems", {"data": {
                      "type": "reviewSubmissionItems",
                      "attributes": {},
                      "relationships": {
                          "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                          "appStoreVersion": {"data": {"type": "appStoreVersions", "id": ver_id}},
                      },
                  }})
                  ver_item = created_item["data"]
                  print("version item created:", ver_item["id"])
              except Exception as e:
                  print("!! create item failed:", e)
                  items = api("GET", f"/reviewSubmissions/{sub_id}/items?include=appStoreVersion")["data"]
                  ver_item = next((i for i in items if i.get("relationships", {})
                                  .get("appStoreVersion", {}).get("data")), None)
          if ver_item is None and items:
              ver_item = items[0]  # 兜底：IOS 提交的第一个 item 即版本项
          if ver_item is None:
              sys.exit(f"submission {sub_id} has no items — resolve in browser Resolution Center first")
          print("version item reused:", ver_item["id"],
                "-> version:", ver_item.get("relationships", {})
                .get("appStoreVersion", {}).get("data", {}).get("id"))
          # 注意：PATCH reviewSubmissionItems 不接受 appStoreVersion relationship
          # ("can not be included in a UPDATE operation") —— item 已指向该版本，无需也无法改

          # Lifetime IAP 随版本提交的正确姿势是挂到版本资源上（不是 submission item，
          # reviewSubmissionItems 没有 IAP relationship）。挂载失败不阻断提交。
          try:
              iaps = api("GET", f"/apps/{app_id}/inAppPurchasesV2?filter[inAppPurchaseType]=NON_CONSUMABLE")["data"]
              lifetime = next((p for p in iaps
                               if p["attributes"].get("productId") == LIFETIME_PRODUCT_ID), None)
              if not lifetime:
                  print("!! lifetime IAP not found in ASC — skipping IAP attach")
              else:
                  life_id = lifetime["id"]
                  print("lifetime IAP:", life_id, "state:", lifetime["attributes"].get("state"))
                  api("POST", f"/appStoreVersions/{ver_id}/relationships/inAppPurchases",
                      {"data": [{"type": "inAppPurchases", "id": life_id}]})
                  print("lifetime IAP attached to version")
          except Exception as e:
              print("!! attach lifetime IAP failed:", e)

          try:
              final = api("PATCH", f"/reviewSubmissions/{sub_id}", {"data": {
                  "type": "reviewSubmissions", "id": sub_id,
                  "attributes": {"submitted": True},
              }})
              print("SUBMITTED for review — state:", final["data"]["attributes"].get("state"))
          except Exception as e:
              # UNRESOLVED_ISSUES 可能要求先在 Resolution Center 回复审核员才能重新提交
              print("!! submit failed:", e)
              print("!! FALLBACK: open ASC in browser -> app version 1.3.1 -> "
                    "App Review page, reply in Resolution Center "
                    "(see RESOLUTION_2_1b.md), then click 'Resubmit to App Review'.")
              sys.exit(2)
          EOF

      - name: Summary
        run: |
          gh run view ${{ github.run_id }} --json status,conclusion,url
          echo "Published 1.4.0 (30) — What's New filled, submitted for App Store review."
