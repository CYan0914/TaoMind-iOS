name: Check ASC Status

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Review submission ID'
        required: true
        default: '5e5866c0-9b73-4bf0-8d98-136c85191477'

jobs:
  check:
    name: Query Review Submission
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
    steps:
      - name: Prepare key
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography

      - name: Query status
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, time, urllib.request, urllib.error
          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          with open(p8, "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)
          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"

          sub_id = "${{ github.event.inputs.submission_id }}"
          req = urllib.request.Request(
              f"https://api.appstoreconnect.apple.com/v1/reviewSubmissions/{sub_id}",
              headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as e:
              print("ERROR_HTTP", e.code, e.read().decode()[:500])
              sys.exit(1)
          attrs = data["data"]["attributes"]
          print("SUBMISSION_STATE:", attrs.get("state"))
          print("ERRORS:", json.dumps(attrs.get("errorMessages") or []))
          for inc in data.get("included", []):
              if inc.get("type") == "appStoreVersions":
                  print("VERSION_STRING:", inc["attributes"].get("versionString"))
              if inc.get("type") == "builds":
                  print("BUILD:", inc["attributes"].get("version"), inc["attributes"].get("processingState"))
          EOF
