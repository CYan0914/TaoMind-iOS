name: Check ASC Status

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Review submission ID (optional)'
        required: false
        default: ''
      build_number:
        description: 'Build number to check'
        required: false
        default: '30'

jobs:
  check:
    name: Query Review Submission
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
    steps:
      - name: Prepare key
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography

      - name: Query status
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, time, urllib.request, urllib.error
          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          with open(p8, "rb") as f:
              key = serialization.load_pem_private_key(f.read(), password=None)
          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"

          def get(path):
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1" + path,
                  headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  print("ERROR_HTTP", e.code, path, e.read().decode()[:600])
                  return None

          # 全量扫描：最近版本状态 + 对应审核意见
          apps = get("/apps?filter[bundleId]=com.cyan0914.taomind")
          app_id = apps["data"][0]["id"]
          vers = get(f"/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=5")
          for v in vers["data"]:
              a = v["attributes"]
              print("VERSION:", a.get("versionString"), "| state:", a.get("appStoreState"),
                    "| id:", v["id"])
          # submission 状态（可选）
          sub_id = "${{ github.event.inputs.submission_id }}"
          if sub_id:
              sub = get(f"/reviewSubmissions/{sub_id}")
              if sub:
                  print("SUBMISSION_STATE:", sub["data"]["attributes"].get("state"))
          # build 状态
          builds = get(f"/apps/{app_id}/builds?limit=5&sort=-uploadedDate")
          for b in (builds or {}).get("data", []):
              print("BUILD:", b["attributes"].get("version"),
                    b["attributes"].get("processingState"),
                    b["attributes"].get("uploadedDate"))
          EOF
