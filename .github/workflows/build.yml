name: Build TaoMind

on:
  workflow_dispatch:
    inputs:
      create_ipa:
        description: 'Build production IPA (requires certs)'
        required: false
        default: false
        type: boolean
      submit_review:
        description: 'Auto-submit to App Store review after TestFlight upload'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN 需要 actions: write 才能在最后一步触发 release.yml（workflow_dispatch）
permissions:
  contents: read
  actions: write

jobs:
  # ─── Build & Test (skipped when create_ipa=true) ────────
  build:
    name: Build for iOS Simulator
    if: github.event.inputs.create_ipa != 'true'
    runs-on: macos-latest  # Need Xcode 26+ for App Store upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (need 26+ for App Store)
        run: |
          echo "=== Available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          # Find ANY Xcode with iOS SDK 26+
          for xc in /Applications/Xcode*.app; do
            if sudo xcode-select -s "$xc/Contents/Developer" 2>/dev/null; then
              sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "unknown")
              echo "  $xc → iOS SDK $sdk"
              if [[ "$sdk" == 2[6-9].* ]] || [[ "$sdk" == [3-9]* ]]; then
                echo "✅ Selected: $xc (iOS SDK $sdk)"
                xcodebuild -version
                exit 0
              fi
            fi
          done
          # Fallback: use the one with highest SDK
          echo "⚠️ No Xcode with SDK 26+ found — using fallback"
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null
          xcodegen --version

      - name: Clean stale project (avoid Xcode format mismatch)
        run: |
          echo "Before cleanup:"
          ls -la TaoMind.xcodeproj/ 2>/dev/null || echo "  (no xcodeproj)"
          rm -rf TaoMind.xcodeproj
          echo "After cleanup: done"

      - name: Generate Xcode Project
        run: xcodegen generate
        working-directory: .

      - name: Ensure iOS platform & simulator runtime (idempotent)
        run: |
          echo "=== Installed runtimes ==="
          xcrun simctl list runtimes
          xcodebuild -downloadPlatform iOS

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project TaoMind.xcodeproj \
            -scheme TaoMind \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
        working-directory: .

      - name: Upload Build Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 7

  # ─── Archive & IPA (manual trigger) ────────────────────
  archive:
    name: Archive for App Store
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_ipa == 'true'
    runs-on: macos-latest  # Need Xcode 26+ for App Store upload
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (need 26+ for App Store)
        run: |
          echo "=== Available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          for xc in /Applications/Xcode*.app; do
            if sudo xcode-select -s "$xc/Contents/Developer" 2>/dev/null; then
              sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "unknown")
              echo "  $xc → iOS SDK $sdk"
              if [[ "$sdk" == 2[6-9].* ]] || [[ "$sdk" == [3-9]* ]]; then
                echo "✅ Selected: $xc (iOS SDK $sdk)"
                xcodebuild -version
                exit 0
              fi
            fi
          done
          echo "⚠️ No Xcode with SDK 26+ found — using fallback"
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null
          xcodegen --version

      - name: Clean stale project (avoid Xcode format mismatch)
        run: |
          echo "Before cleanup:"
          ls -la TaoMind.xcodeproj/ 2>/dev/null || echo "  (no xcodeproj)"
          rm -rf TaoMind.xcodeproj
          echo "After cleanup: done"

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Ensure iOS SDK is ready (Xcode first launch)
        run: |
          # 1) Accept license & run first launch
          sudo xcodebuild -license accept 2>&1 || true
          sudo xcodebuild -runFirstLaunch 2>&1 || true

          # 2) Install iOS platform with retry (removes || true so we see failures)
          echo "--- Downloading iOS platform ---"
          for i in 1 2 3; do
            echo "Attempt $i..."
            sudo xcodebuild -downloadPlatform iOS -quiet 2>&1 && break
            echo "Attempt $i failed, sleeping 10s..."
            sleep 10
          done

          # 3) Verify SDK
          echo "=== SDK verification ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || echo "⚠️ iphoneos SDK not found!"
          xcrun --sdk iphoneos --show-sdk-path || true
          ls -la /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/DeviceSupport/ 2>/dev/null | head -5 || echo "No DeviceSupport found"
          echo "=== Done ==="

      - name: Clean up stale Development certificates (best-effort, prevent cert limit)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          # 每次归档 automatic signing 会新建开发证书，runner 无私钥无法复用，导致账号证书越积越多。
          # 构建前用 App Store Connect API 删掉旧证书、只留最新一个。best-effort：失败不阻断构建。
          set +e
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          python3 -m pip install --quiet cryptography 2>/dev/null || true
          python3 - <<'EOF'
          import base64, json, os, sys, time, urllib.request
          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer = os.environ["APPSTORE_ISSUER_ID"]
          p8 = f"/tmp/AuthKey_{key_id}.p8"
          try:
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import ec
              from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
              with open(p8, "rb") as f:
                  key = serialization.load_pem_private_key(f.read(), password=None)
          except Exception as e:
              print("cryptography unavailable, skipping:", e)
              sys.exit(0)
          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()
          now = int(time.time())
          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}  # exp 必须 ≤20 分钟，+1800 会 401
          h = b64(json.dumps(header, separators=(",", ":")).encode())
          p = b64(json.dumps(payload, separators=(",", ":")).encode())
          # ES256 JWT 需要 raw R||S（64 字节），cryptography 默认返回 DER（~71 字节）→ 必须转换
          der_sig = key.sign((h + "." + p).encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(der_sig)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          token = f"{h}.{p}.{b64(sig)}"
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/certificates?filter%5BcertificateType%5D=DEVELOPMENT&limit=200",
              headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
          except Exception as e:
              print("list certs failed (maybe no permission), skipping:", e)
              sys.exit(0)
          certs = sorted(data.get("data", []),
                         key=lambda c: c.get("attributes", {}).get("createdDate", ""), reverse=True)
          print(f"Found {len(certs)} DEVELOPMENT certs; keeping newest, revoking {max(0, len(certs) - 1)}")
          for c in certs[1:]:
              cid = c["id"]
              r = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/certificates/{cid}",
                  method="DELETE",
                  headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      print("  revoked", cid, resp.status)
              except Exception as e:
                  print("  revoke failed", cid, e)
          EOF

      - name: Archive (automatic signing)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          xcodebuild \
            archive \
            -project TaoMind.xcodeproj \
            -scheme TaoMind \
            -configuration Release \
            -destination generic/platform=iOS \
            -sdk iphoneos \
            -archivePath TaoMind.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=H4VQ9X6KYK
        working-directory: .

      - name: Re-sign archive app with full profile entitlements (carry applesignin)
        run: |
          APP=TaoMind.xcarchive/Products/Applications/TaoMind.app
          # The archive's xcent drops applesignin. Re-sign with the profile's
          # full entitlements (which include applesignin) so the export
          # re-sign preserves it.
          security cms -D -i $APP/embedded.mobileprovision 2>/dev/null | plutil -extract Entitlements xml1 -o /tmp/ents.plist - 2>/dev/null
          echo "=== entitlements to apply ==="
          cat /tmp/ents.plist 2>/dev/null || echo "(no entitlements extracted)"
          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | grep -i "Apple Development" | head -1 | grep -oE '"[^"]+"' | tr -d '"')
          echo "=== signing identity ==="
          echo "$IDENTITY"
          codesign --force --sign "$IDENTITY" --entitlements /tmp/ents.plist "$APP" 2>&1
          echo "=== archive app signature after re-sign ==="
          codesign -d --entitlements :- "$APP" 2>&1 | tail -3
        working-directory: .

      - name: Export IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          # Write API key robustly (strip CRLF, no trailing newline added by echo)
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > /tmp/AuthKey_${APPSTORE_KEY_ID}.p8
          echo "=== p8 diagnostics ==="
          echo "size: $(wc -c < /tmp/AuthKey_${APPSTORE_KEY_ID}.p8) bytes"
          echo "first line: $(head -1 /tmp/AuthKey_${APPSTORE_KEY_ID}.p8)"
          echo "last line:  $(tail -1 /tmp/AuthKey_${APPSTORE_KEY_ID}.p8)"
          xcodebuild \
            -authenticationKeyPath /tmp/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -allowProvisioningUpdates \
            -exportArchive \
            -archivePath TaoMind.xcarchive \
            -exportPath ./TaoMind.ipa \
            -exportOptionsPlist Resources/ExportOptions.plist
        working-directory: .

      - name: Capture Distribution Logs (on failure)
        if: failure()
        run: |
          mkdir -p dist-logs
          find /var/folders -maxdepth 8 -name "*.xcdistributionlogs" -type d 2>/dev/null | while read d; do
            echo "Copying: $d"
            cp -r "$d" dist-logs/ 2>/dev/null || true
          done
          ls -la dist-logs/ || true

      - name: Upload Distribution Logs Artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-distribution-logs
          path: dist-logs/
          retention-days: 7

      - name: Upload IPA (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: TaoMind-IPA
          path: TaoMind.ipa/TaoMind.ipa
          retention-days: 30

      - name: Upload to App Store Connect (TestFlight)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          if [ -z "$APPSTORE_KEY_ID" ]; then
            echo "APPSTORE_KEY_ID not set — skipping TestFlight upload. IPA available as artifact."
            exit 0
          fi
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_API_KEY" | tr -d '\r' > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          set +e
          ALT_OUT=$(xcrun altool --upload-app \
            -f "TaoMind.ipa/TaoMind.ipa" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --type ios \
            --verbose 2>&1)
          ALT_EXIT=$?
          set -e
          echo "$ALT_OUT"
          # altool sometimes exits 0 even when the upload was rejected —
          # treat its own failure message as a hard error
          if [ $ALT_EXIT -ne 0 ] || printf '%s' "$ALT_OUT" | grep -q "Failed to upload package"; then
            echo "::error::altool upload failed"
            exit 1
          fi
          echo "Upload OK"
        working-directory: .

      - name: Auto-trigger App Store release (What's New + submit review)
        if: success() && github.event.inputs.submit_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml -R "$GITHUB_REPOSITORY"
          echo "Triggered release.yml — will fill What's New and submit ${VERSION:-1.3.0} (${BUILD:-28}) for review once the build is processed."
